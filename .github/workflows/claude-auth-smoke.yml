name: Claude auth smoke test (TEMPORARY — delete after step 2)

# Answers one question that cannot be answered any other way: did
# CLAUDE_CODE_OAUTH_TOKEN paste in intact?
#
# GitHub secrets are write-only — nothing can read one back, so the choice is
# between re-pasting on faith and running something that uses it. This runs
# something that uses it.
#
# `on: push` rather than `workflow_dispatch` deliberately: a
# `workflow_dispatch` workflow does not appear in the Actions UI, and cannot be
# triggered by API, until it exists on the DEFAULT branch. This file is on a
# feature branch, so the manual trigger would simply not be offered — which
# would look like the workflow was broken rather than unreachable.
#
# DELETE THIS FILE once the token is confirmed. It is scaffolding, and a smoke
# test wired to a branch name rots the moment the branch is gone.

on:
  push:
    branches: [claude/linear-webhook-dispatch-aoobwx]

jobs:
  smoke:
    name: Does CLAUDE_CODE_OAUTH_TOKEN work?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the action's default GitHub App auth needs this

    steps:
      # Runs BEFORE the action, because a malformed secret should be named as
      # a malformed secret rather than surfacing later as an opaque auth
      # failure from inside the action.
      #
      # Nothing here prints the secret. Length and a prefix CLASS are safe and
      # are the two things that actually diagnose a bad paste; GitHub masks
      # secret values in logs, but that masking is not something to lean on, so
      # the value is never echoed in the first place.
      - name: Check the secret's shape
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty or not set on this repository."
            exit 1
          fi

          echo "Length: ${#TOKEN} characters"

          # THE CHECK THIS FILE EXISTS FOR. A terminal soft-wrap is visual only
          # and copies back as one line, but a selection dragged across a
          # wrapped region can pick up a real newline or stray spaces. A
          # credential should contain no whitespace at all, so any is a broken
          # paste — and this is the failure that otherwise shows up three steps
          # later as "invalid credentials".
          if printf '%s' "$TOKEN" | LC_ALL=C grep -q '[[:space:]]'; then
            echo "::error::The secret contains whitespace (space, tab, or newline)."
            echo "::error::That is a broken paste, not a bad token. Re-copy it and update the secret."
            exit 1
          fi

          case "$TOKEN" in
            sk-ant-oat*)
              echo "Prefix: OAuth token from \`claude setup-token\` — correct for the claude_code_oauth_token input." ;;
            sk-ant-api*)
              echo "::error::This is an API key, not an OAuth token. Either re-run \`claude setup-token\`,"
              echo "::error::or switch the workflow input back to anthropic_api_key."
              exit 1 ;;
            *)
              echo "::warning::Unrecognised prefix. Continuing — the live check below is the real verdict." ;;
          esac

      # The actual proof. No checkout, no tools, one turn: this is an
      # authentication check, not a Claude evaluation, and it should cost
      # essentially nothing against the subscription.
      - name: Authenticate for real
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Reply with exactly: AUTH OK. Use no tools.'
          claude_args: '--max-turns 1'
