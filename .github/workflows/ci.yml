name: CI

# NFR-01 requires CI on "every push/PR" -- so intentionally no `branches:`
# filter is applied here: this runs on a push to any branch and on any
# pull_request event regardless of base branch. (Repo default branch was
# confirmed to be `main` via `git remote show origin` / `HEAD branch: main`,
# but that fact is not used to narrow these triggers -- narrowing would mean
# feature-branch pushes silently skip CI, which NFR-01's "every push" wording
# does not allow.)
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, Lint, Format, Test, Build, Bundle Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node version is pinned explicitly (not left floating) per NFR-01.
      # Node 22 LTS -- matches the version this project's Astryx/React 19
      # stack has been developed and verified against throughout.
      #
      # Originally pinned to 20.18.1, which broke real CI: jsdom's
      # transitive dependency chain (html-encoding-sniffer -> @exodus/bytes,
      # an ESM-only package) requires Node's synchronous require(esm)
      # interop, which whatwg-url@16's own `engines` field declares as
      # `^20.19.0 || ^22.12.0 || >=24.0.0`. Node 20.18.1 predates that
      # support on the 20.x line (it landed at 20.19.0), so `npm run test`
      # failed with ERR_REQUIRE_ESM on GitHub's runner even though every
      # other check passed. 22.22.2 satisfies the `^22.12.0` branch with
      # margin and avoids GitHub's own Node 20 deprecation warnings.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # T175. This gate was missing for the project's whole life, and the
      # cost was not hypothetical: `checkin.test.ts` landed unformatted with
      # T400 on 2026-08-04 and every subsequent PR merged green while the
      # repo failed its own `format:check`. Prettier drift is invisible to
      # typecheck, lint, test and build -- none of them read formatting --
      # so without this step nothing in CI can ever observe it.
      #
      # Deliberately `npm run format:check` and not a bare `prettier --check`
      # with its own glob. The script (package.json) scopes the gate to
      # `src/**/*.{ts,tsx}` minus `src/theme/volt.ts`, plus root config files.
      # `docs/**` is outside that scope ON PURPOSE: four machines append to
      # the swarm docs concurrently, and reformatting them would rewrite
      # thousands of lines straight into everyone's merge conflicts.
      # Duplicating the glob here would also let the two drift apart, which
      # is the same class of defect this step exists to catch.
      #
      # Placed after Lint rather than first: a PR with both a type error and
      # a stray line break should report the type error, which is the one
      # that needs thought. Formatting failures are fixed by `npm run format`.
      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # NFR-04: "Initial route JS < 300 KB gz; route-level code splitting present."
      #
      # "Initial route JS" is read here as the eager entry chunk(s) that are
      # actually loaded on first paint -- i.e. the <script type="module" src="...">
      # tag(s) Vite writes directly into dist/index.html -- NOT the sum of every
      # JS file emitted into dist/. This distinction matters because once real
      # route-level code splitting lands (React.lazy()/dynamic import() per
      # route, in T006+), lazily-loaded route chunks will NOT be referenced by
      # an eager <script> tag in index.html; they only load on navigation. A
      # gate that summed the whole dist/ directory would falsely fail as the
      # app grows via legitimate code-splitting, and a gate that only checked
      # the largest single file could falsely pass if there were multiple eager
      # entry chunks. Measuring exactly the index.html-referenced eager
      # module script(s) is what stays correctly scoped as routes are added:
      # it enforces the initial-paint budget today, and it will continue to
      # correctly enforce it once T006+ adds real lazy route chunks that sit
      # outside index.html's eager <script> tags.
      #
      # No bundle-analyzer dependency is used -- this only shells out to the
      # standard `gzip`/`wc` CLIs (present on ubuntu-latest) plus a `grep -oP`
      # regex extraction of the handful of <script type="module"> tags in
      # dist/index.html, per the dependency allowlist (constitution item 9).
      - name: 'Bundle size gate (NFR-04: initial route JS < 300 KB gz)'
        run: |
          set -euo pipefail

          BUDGET_BYTES=$((300 * 1024))
          DIST_DIR="dist"
          INDEX_HTML="$DIST_DIR/index.html"

          if [ ! -f "$INDEX_HTML" ]; then
            echo "ERROR: $INDEX_HTML not found. Run 'npm run build' first." >&2
            exit 1
          fi

          # Extract src="" from any <script type="module" ...> tag in
          # dist/index.html. These are the eagerly-loaded entry chunk(s) for
          # first paint. Attribute order (e.g. crossorigin before/after
          # type="module") does not matter to this extraction.
          mapfile -t ENTRY_SCRIPTS < <(
            grep -oP '<script\b[^>]*>' "$INDEX_HTML" \
              | grep 'type="module"' \
              | grep -oP 'src="\K[^"]+' || true
          )

          if [ "${#ENTRY_SCRIPTS[@]}" -eq 0 ]; then
            echo "ERROR: no <script type=\"module\" src=\"...\"> tags found in $INDEX_HTML" >&2
            exit 1
          fi

          TOTAL_BYTES=0
          echo "Initial route JS (eager entry chunks referenced in $INDEX_HTML):"
          for src in "${ENTRY_SCRIPTS[@]}"; do
            # Strip query string/hash, strip leading slash, resolve into dist/.
            clean_src="${src%%\?*}"
            clean_src="${clean_src%%\#*}"
            clean_src="${clean_src#/}"
            file="$DIST_DIR/$clean_src"

            if [ ! -f "$file" ]; then
              echo "ERROR: entry script '$src' referenced in $INDEX_HTML but '$file' does not exist" >&2
              exit 1
            fi

            gz_size=$(gzip -9 -c "$file" | wc -c)
            echo "  - $file : ${gz_size} bytes (gzip)"
            TOTAL_BYTES=$((TOTAL_BYTES + gz_size))
          done

          echo ""
          echo "Total initial route JS (gzip): ${TOTAL_BYTES} bytes"
          echo "Budget (NFR-04):               ${BUDGET_BYTES} bytes (300 KB)"

          if [ "$TOTAL_BYTES" -gt "$BUDGET_BYTES" ]; then
            echo ""
            echo "FAIL: initial route JS gzip size (${TOTAL_BYTES} bytes) exceeds the 300 KB budget (${BUDGET_BYTES} bytes)."
            exit 1
          fi

          echo ""
          echo "PASS: initial route JS gzip size is within the 300 KB budget."

  # ---------------------------------------------------------------------------
  # T701: the SQL suites now actually run.
  #
  # Every `run*.sh` under `supabase/tests/` and `tests/rls/` was unrunnable,
  # green-but-never-executed, or both -- and NOTHING invoked them. `tests/rls/
  # run.sh` had been unable to even start on a bare Postgres since roughly the
  # time `student_teams` landed, and `supabase/tests/run.sh` was hiding a
  # genuinely failing assertion (its fixture never seeded `student_teams`, so
  # `v_student_participation` returned zero rows once that view migrated onto
  # ACTIVE memberships). Neither failure was visible, because the only thing
  # that would have shown them was a runner nobody ran.
  #
  # This job is the fix for the CLASS, not just the two instances. It is a
  # separate job from `ci` on purpose: it needs a Postgres service container,
  # it is slower, and a red SQL suite should name itself rather than hide
  # inside a generic "CI failed".
  #
  # Two migrations are skipped INSIDE the runners (not here) because they need
  # Supabase-platform objects that do not exist on stock Postgres -- pg_net is
  # not packaged for Debian/Ubuntu at all. Each runner names its own skips.
  sql:
    name: SQL suites (RLS denial, metric views, migration guards)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without a healthcheck the steps below can start before Postgres is
        # accepting connections, which would fail as a confusing psql error
        # rather than an honest "database not ready".
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Sanity-check the connection before running any suite
        run: psql -X -v ON_ERROR_STOP=1 -c 'select version();'

      # Each suite runs in its own step so a failure names the suite directly.
      - name: 'RLS denial suite (NFR-02)'
        run: bash tests/rls/run.sh

      - name: 'Metric-view fixture suite (NFR-03)'
        run: bash supabase/tests/run.sh

      - name: 'T700 updatable-view write-path guard'
        run: bash supabase/tests/run_t700_updatable_view_guard.sh

      - name: 'T801 dashboard-views comment assertions'
        run: bash supabase/tests/run_t801_dashboard_views_comments.sh

      - name: 'T205 anon grant assertions'
        run: bash supabase/tests/run_t205_anon_grant.sh

      - name: 'T322 volunteer-hours outreach-only assertions'
        run: bash supabase/tests/run_volunteer_hours_outreach_only.sh

      - name: 'T503 widen-rsvp-read assertions'
        run: bash supabase/tests/run_t503_widen_rsvp_read.sh

      - name: 'T195 calendar-feed lifecycle assertions'
        run: bash supabase/tests/run_calendar_feed_lifecycle.sh

      - name: 'T509 explicit-marks denominator (MET-01/D014)'
        run: bash supabase/tests/run_t509_explicit_marks.sh

  # ---------------------------------------------------------------------------
  # T612: the anti-vacuity check now checks itself.
  #
  # `.claude/skills/mutation-replay/scripts/replay.py` decides whether an agent
  # is allowed to believe its own evidence, and it shipped a summary parser that
  # read a genuinely red focused run ("Tests  1 failed | 69 skipped (70)" -- no
  # `passed` segment) as `failed=0 passed=0`, then announced UNTRUSTWORTHY: the
  # mutated run executed no tests. A checker caught it only by refusing the
  # tool's verdict and re-running the mutation by hand.
  #
  # A separate job, and not a step inside `ci`, for the same reason the `sql`
  # job is separate (T701): this needs no npm install, and a broken replay tool
  # should name itself rather than hide inside a generic "CI failed". Vitest
  # cannot cover these -- `.claude/**` is in its exclude list, and the script is
  # Python. Without this job it would be a test nobody runs, which is the exact
  # class of defect T701 was filed for.
  skill-scripts:
    name: Skill script tests (mutation-replay, gate-run parsers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Standard library only -- no pip install, no requirements file. The
      # runner's system python3 is the same interpreter an agent invokes the
      # skill with.
      - name: Mutation-replay parser and verdict tests
        run: python3 .claude/skills/mutation-replay/scripts/test_replay.py

      # gate-run reads the same vitest summary shapes, and reports the counts
      # three agents then quote at each other. Its parser earns the same
      # coverage for the same reason: a misread summary is a number nobody
      # re-derives.
      - name: Gate-run parser and scope-derivation tests
        run: python3 .claude/skills/gate-run/scripts/test_gates.py

  # ---------------------------------------------------------------------------
  # Edge Function unit tests (Deno).
  #
  # THESE TESTS EXISTED AND NOTHING RAN THEM. `supabase/functions/checkin/`
  # has shipped five `*.test.ts` files since T032 -- hmac, grace, liveness,
  # rate_limit, validation -- and this repository had no Deno job, so every
  # one of them was a test nobody ran. That is the same defect class T701 was
  # filed for and the same shape section 6 of the tracker-migration doc keeps
  # recording: a guard that never fires is indistinguishable from one that
  # works. Adding `linear-dispatch`'s tests without this job would have made
  # it two directories of unenforced coverage instead of one.
  #
  # A separate job, like `sql` and `skill-scripts`: it needs no `npm ci`, and
  # a broken Edge Function should name itself rather than hide inside a
  # generic "CI failed".
  #
  # `deno test` type-checks as it runs, so this covers the functions'
  # TypeScript too -- `tsconfig`/vitest do not, since `supabase/functions/**`
  # is Deno-resolved (`npm:` specifiers, `.ts` import suffixes) and would not
  # type-check under the app's Node config.
  edge-functions:
    name: Edge Function tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Matches `deno_version = 2` in supabase/config.toml, which is the
          # runtime these actually run on in production.
          deno-version: v2.x

      # Per-directory, not one `deno test supabase/functions/` over the lot.
      # Each function owns a `deno.json`, and Deno applies the config nearest
      # the working directory -- so a single root-level invocation resolves
      # every function's npm specifiers against the WRONG config and dies on
      # the first one it cannot find (`ical-generator` in `ics/`,
      # `@supabase/supabase-js` in `checkin-token/`) before running a single
      # test. Measured, not assumed: the root-level form fails at collection.
      #
      # The loop DISCOVERS directories rather than listing them. A hardcoded
      # list is how the gap this job closes would silently reopen -- the next
      # function would ship with tests nobody runs and nothing would say so.
      #
      # `--allow-env --allow-read`: `send-invite` and `send-reminders` read
      # `RESEND_SEND_MODE`/`RESEND_API_KEY` to prove their fail-closed
      # defaults, and `send-invite` asserts against its own source text. Both
      # are legitimately unit tests; neither needs `--allow-net`, and none of
      # these should ever need it.
      #
      # `failed=1` rather than a bare `set -e` exit: every directory runs even
      # after one goes red, so a single failure does not hide the state of the
      # other five.
      - name: Run Edge Function unit tests
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          ran=0
          for dir in supabase/functions/*/; do
            compgen -G "${dir}*.test.ts" > /dev/null || continue
            ran=$((ran + 1))
            echo "::group::${dir}"
            ( cd "$dir" && deno test --allow-env --allow-read ) || failed=1
            echo "::endgroup::"
          done
          # A pass because nothing ran is the failure mode this whole job
          # exists to prevent, so it is an explicit error rather than a green
          # tick over an empty loop.
          if [ "$ran" -eq 0 ]; then
            echo "::error::No Edge Function test directories were found. Expected at least one."
            exit 1
          fi
          echo "Ran Deno tests in ${ran} Edge Function directories."
          exit "$failed"
