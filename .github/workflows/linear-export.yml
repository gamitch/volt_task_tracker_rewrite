name: Linear export

# Keeps `docs/swarm/linear-export.{json,md}` — the git-side backup that item 29
# freezes the ledger on the promise of — from rotting.
#
# THIS IS A HEALING JOB, NOT A GATE, AND THAT IS DELIBERATE.
#
# Item 29c originally said "let CI enforce it" with `--check` on pull requests.
# That specification was wrong and would have blocked every task PR for a
# correct reason: claiming an issue moves it `Todo -> In Progress`, which makes
# the committed export stale *by definition*, and the agent cannot fix it —
# the final state only exists after the merge closes the issue. A gate there
# fails on work that is proceeding exactly as designed.
#
# So this exports and commits instead. Nothing is ever blocked, and the backup
# is never staler than the last merge.
#
# Triggers, in order of usefulness:
#   * push to main — refreshes right after a merge, which is precisely when
#     issue state has just changed. `paths-ignore` stops this job's own commit
#     from retriggering it.
#   * daily schedule — catches state changed in Linear directly (an owner
#     dragging a card), which no push would notice.
#   * manual — for when you have just done a batch by hand.
#
# Requires the `LINEAR_API_KEY` repository secret. **A read-only key is
# sufficient and is what should be used** — this workflow only reads Linear,
# and a scheduled job holding a write-capable key is more blast radius than the
# work needs. Until the secret exists the job fails loudly, which is the
# intended behaviour: a silent skip would be the rot this exists to prevent.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/swarm/linear-export.json'
      - 'docs/swarm/linear-export.md'
  schedule:
    # 06:00 UTC daily.
    - cron: '0 6 * * *'
  workflow_dispatch:

# Never let two exports race to commit the same generated files.
concurrency:
  group: linear-export
  cancel-in-progress: false

jobs:
  export:
    name: Export Linear to git
    runs-on: ubuntu-latest
    # Only this job writes, and only these two files.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to match ci.yml rather than floating; see that file's own note
      # on why 22.22.2 specifically.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      # No `npm ci`: scripts/linear-export.mjs uses only node: builtins and
      # global fetch. Installing the app's dependencies here would add minutes
      # and a supply-chain surface for a script that needs neither.
      - name: Export
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "${LINEAR_API_KEY}" ]; then
            echo "::error::LINEAR_API_KEY secret is not set. Add it in"
            echo "::error::Settings -> Secrets and variables -> Actions. A read-only key is enough."
            exit 1
          fi
          node scripts/linear-export.mjs

      - name: Commit if the export moved
        run: |
          if git diff --quiet -- docs/swarm/linear-export.json docs/swarm/linear-export.md; then
            echo "Export unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Explicit pathspecs only (constitution item 22): this job may commit
          # the two generated files and nothing else, ever.
          git add docs/swarm/linear-export.json docs/swarm/linear-export.md
          git commit -m 'chore(swarm): refresh the Linear export [skip ci]' \
                     -m 'Generated by .github/workflows/linear-export.yml. Linear is the source of truth; these files are the git-side backup (constitution item 29b).'
          git push

      # Runs after the commit, so it asserts against what was just written.
      # If this fails the export is non-deterministic or wrote a partial file,
      # which is worth knowing loudly — a backup nobody can trust is not one.
      - name: Verify the committed export is current
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/linear-export.mjs --check
