name: Claude — Linear dispatch

# The GitHub half of the Linear -> Claude dispatch loop. The Supabase half is
# `supabase/functions/linear-dispatch/`; the whole design, and the evidence
# behind every constraint asserted here, is in
# `docs/swarm/2026-08-09-linear-webhook-dispatch.md`.
#
#   owner drags GAM-nnn from `Backlog` to `Todo` in Linear
#     -> Linear webhook -> the `linear-dispatch` edge function
#     -> `repository_dispatch` (event type below) -> this workflow.
#
# ---------------------------------------------------------------------------
# FOUR THINGS THAT WILL BITE, ALL VERIFIED RATHER THAN ASSUMED
# ---------------------------------------------------------------------------
#
# 1. **`repository_dispatch` only ever runs a workflow from the DEFAULT
#    BRANCH.** This file does nothing at all until it is merged to `main`.
#    Testing it on a feature branch produces no run and no error — the
#    dispatch is accepted with 204 and silently matches no workflow.
#
# 2. **The dispatching PAT must belong to a human GitHub account.**
#    `github.actor` on this run becomes the PAT's owner, and
#    claude-code-action's `checkHumanActor` throws unless
#    `octokit.users.getByUsername(actor).type === 'User'`. `gamitch` is a
#    `User`, so a PAT owned by `gamitch` passes. A GitHub App installation
#    token or a machine account resolves to type `Bot` and the run dies before
#    Claude starts — with a message about bots and `allowed_bots` that reads
#    like a configuration problem rather than the token-identity problem it
#    actually is.
#
#    Note `allowed_bots` is NOT the fix here: it would let a bot-triggered run
#    through, which defeats the purpose of the check rather than satisfying
#    it. Owning the PAT with a human account is the fix.
#
# 3. **A plain-text `prompt` grants Claude no tools.** In automation mode
#    Claude has no shell and no GitHub API access until `--allowedTools`
#    says otherwise, so an under-specified `claude_args` produces a run that
#    starts, thinks, and accomplishes nothing.
#
# 4. **Commits pushed with the default `GITHUB_TOKEN` do not trigger CI.**
#    A PR whose checks never run is worse than a red one, because it looks
#    fine. `CLAUDE_PR_TOKEN` (a human PAT) is used for git operations where
#    it exists, falling back to the built-in token — with the caveat above.

on:
  repository_dispatch:
    types: [linear-issue-dispatch]

# One run per issue. Two agents on one row is the exact race constitution
# item 28c's claim-then-re-read exists to shrink; there is no reason to open
# a second front here. Not `cancel-in-progress`: a half-finished agent that
# has already claimed the issue in Linear should be allowed to finish.
concurrency:
  group: linear-dispatch-${{ github.event.client_payload.identifier }}
  cancel-in-progress: false

jobs:
  work:
    name: ${{ github.event.client_payload.identifier }} — ${{ github.event.client_payload.title }}
    runs-on: ubuntu-latest
    # A runaway agent consumes subscription capacity by the minute, so this
    # stays bounded — but an
    # hour was measured too short for the work it has to hold. Run 31358757094
    # was CANCELLED by this timeout at 60:14 having pushed nothing: a full
    # HEAVY chain is worker + separate checker + a mutation replayed for every
    # acceptance criterion, and that does not fit an hour. The two runs that
    # did fit (22 and 32 minutes) only wrote packets and ran gates.
    #
    # 120 keeps `--max-turns` below as the real backstop for a looping agent
    # while giving a genuine chain room to finish. The cost of a runaway
    # doubles; the cost of a run that does 90 minutes of work and is killed at
    # 60 is all of it, which is what happened.
    #
    # The better fix is probably to stop making one run hold the whole chain —
    # worker and checker racing a single clock is the actual design smell —
    # but that is a redesign, and this is the measurement-backed increment.
    timeout-minutes: 120

    # The edge function already filters, but a workflow must not assume its
    # only caller is the one it was written for — anyone able to fire a
    # `repository_dispatch` reaches this file directly, bypassing every rule
    # in filter.ts.
    if: github.event.client_payload.identifier != ''

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # required for the action's default GitHub App auth
      actions: read # lets Claude read its own CI results

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the agent needs to branch from `main` and read
          # provenance, and `git log` is how this project records item 24
          # trailers.
          fetch-depth: 0
          token: ${{ secrets.CLAUDE_PR_TOKEN || github.token }}

      - name: Work the issue
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Used by scripts/linear/client.mjs to claim and update the issue.
          # This key must be WRITE-capable, unlike the deliberately read-only
          # key `linear-export.yml` uses — hence a separate secret name rather
          # than quietly widening that one's scope.
          LINEAR_API_KEY: ${{ secrets.LINEAR_DISPATCH_API_KEY }}
          GH_TOKEN: ${{ secrets.CLAUDE_PR_TOKEN || github.token }}
        with:
          # Subscription auth rather than an API key, by the owner's choice:
          # runs draw on the Claude subscription instead of API billing.
          # Generated locally with `claude setup-token`.
          #
          # This token is tied to the subscription of whoever generated it, so
          # it is a personal credential, not a shared one — the org-level
          # advice to prefer an API key applies when several repositories share
          # a secret, which is not the case here.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Providing `prompt` selects automation mode: Claude runs
          # immediately rather than waiting for an `@claude` mention.
          #
          # The prompt deliberately does NOT restate constitution item 28
          # (item 3: rules live in one place). It points at the files that
          # carry the rules and lets the agent read them, which is also the
          # only version that stays correct when item 28 next changes.
          prompt: |
            You have been dispatched from Linear because ${{ github.event.client_payload.identifier }}
            was moved into `Todo`.

              Issue:    ${{ github.event.client_payload.identifier }}
              Title:    ${{ github.event.client_payload.title }}
              URL:      ${{ github.event.client_payload.url }}
              Tier:     tier/${{ github.event.client_payload.tier }}
              Labels:   ${{ join(github.event.client_payload.labels, ', ') }}

            Read `AGENTS.md` (§ "Where work comes from") and
            `docs/swarm/constitution.md` item 28 FIRST, and follow them exactly.
            They are binding and their order matters. In particular: claim the
            issue in Linear before you open any other file, then re-read it to
            confirm you hold it — Linear has no compare-and-set, so without
            that read-back this is a hope rather than a claim.

            The issue body is deliberately NOT reproduced here. Fetch it live
            from Linear; a copy pasted into this workflow would be a second,
            staler version of the description for you to disagree with.

            If the tier is `tier/unreviewed`, judging the tier is part of
            claiming (item 28d) — do it before moving the issue to
            `In Progress`, and state your reasoning.

            Once you hold it, **item 26** decides how much process the row
            gets and **item 19** decides what must happen before any packet
            reaches a worker. Read both — they are binding, and neither is
            restated here.

            **You can delegate, and for STANDARD and HEAVY you are expected
            to.** `.claude/agents/` holds the roster and its model pins, which
            apply themselves when you spawn an agent; `SWARM-QUICKSTART.md`
            § "Model Selection" explains how the three mechanisms interact,
            including item 18's per-dispatch `model: "opus"` override. Note
            that `AGENTS.md` is written for Codex and names Codex models — the
            constitution is the runtime-neutral version and outranks it.

            **EVERY subagent you dispatch MUST be dispatched with
            `run_in_background: false`, and you must NEVER end your turn with
            one still in flight.** This is the single most load-bearing
            instruction in this prompt, and it is measured, not stylistic.

            Subagents run in the background BY DEFAULT. When your turn ends,
            this process exits and takes every backgrounded subagent with it —
            and the SDK returns normally, so the job goes GREEN while the work
            you were waiting on never happened. Five runs have died exactly
            this way: 31354278407 (round-2 gate), 31385764526 (checker, 54
            turns of 300 and 59 minutes of 120), 31514339272, 31523233268 and
            31527801235 — the last three all on GAM-325, all at the moment a
            `checker-premise` was dispatched. **None was anywhere near
            `--max-turns` or `timeout-minutes`.** More room would not have
            saved any of them; blocking on the subagent would have saved all
            five.

            The one run that survived a full chain (31527801235's sibling on
            GAM-314) did exactly one thing differently: it passed
            `run_in_background: false` and waited. That is the whole fix.

            So: dispatch, WAIT for the result, record the verdict in the run
            log, and only then continue. If you catch yourself writing "is
            running in the background", "I'll check on it", or any sentence in
            the present continuous about work you have not seen finish — stop.
            That sentence is the bug, and the `assert-released` job below will
            turn your green run red for it.

            When you dispatch a subagent, write the run-log line BEFORE you
            wait, and word it so it indicts you if you vanish: *"if this line
            is the last one in this file, the run died holding this subagent."*
            One sentence, and the next reader knows exactly what happened
            instead of guessing.

            Stop and leave the issue in `Todo` if the premise does not hold
            when you measure it. A correct refusal to proceed, recorded on the
            issue, is a better outcome than a confident change built on a
            premise nobody checked — that failure has its own section in
            `docs/swarm/2026-08-09-tracker-migration.md`.

            **KEEP A RUN LOG, AND PUSH IT AS YOU GO. This is not optional and
            it is not bookkeeping — it is the only thing that survives if you
            are killed.** You run on an ephemeral container with a hard wall
            clock. Anything living only in the working tree dies with it, and
            the execution transcript is NOT saved when the job is cancelled.
            Run 31358757094 held roughly an hour of real work in an
            uncommitted tree, hit the timeout, and left nothing at all — no
            commit, no artifact, no record of what it had done.

            So: create `docs/swarm/active/<ISSUE>-run-log.md` as your FIRST
            file write, and after every milestone append one line and
            immediately `git add` that exact path and `git commit && git push`.
            Milestones are: claimed; packet written or read; each subagent
            dispatched; each subagent's verdict; gates run; PR opened. Push
            the log even when nothing else is ready to push — a branch with
            only a log on it is a good outcome compared to silence.

            **A dispatched subagent and its verdict are two separate
            milestones, and the gap between them is where five runs have
            died.** Push the dispatch line before you wait; push the verdict
            line the moment it returns. A log whose last entry is a dispatch
            with no verdict is the signature of this failure — write it so
            that signature is unmistakable (see the delegation rule above).

            **Commit and push real work at every boundary too**, not once at
            the end. A packet, a verdict, a worker's diff: push each as it
            lands. Item 26 already teaches "commit before mutating" for
            mutation proofs; this is the same discipline applied to the run.
            Use explicit pathspecs — item 22 forbids `git add -A`.

            If you are near the wall clock with work in flight, stop, push
            what exists, and say so in the log and on the issue. A partial
            result that is written down beats a complete one that is killed.

          # Renders Claude's own report into the GitHub Step Summary — the
          # panel above the log, which is where anyone looks first.
          #
          # DEFAULTS TO FALSE, so this is a real change and not decoration.
          # The action's own warning is that it puts Claude-authored content in
          # the Step Summary and should be used "solely with trusted input".
          # Here the input is a Linear issue written by the owner in a
          # single-member workspace, which meets that bar. It would stop
          # meeting it the moment anyone else can file into `Todo`.
          #
          # NOT enabling `show_full_output`. That emits every tool result, and
          # this agent holds a write-capable Linear key and unrestricted Bash —
          # so it is a debugging switch to flip deliberately for one run, not a
          # standing setting. The artifact below gives the same detail without
          # printing it into the log.
          display_report: true

          # ---------------------------------------------------------------
          # READ THIS BEFORE INTERPRETING ANY DOLLAR FIGURE BELOW
          # ---------------------------------------------------------------
          # **The `$` figures in these comments are NOT money anyone is
          # charged.** This workflow authenticates with
          # `claude_code_oauth_token` (see the note above), so runs draw on the
          # owner's Claude subscription and `ANTHROPIC_API_KEY` is empty. The
          # SDK still reports `total_cost_usd` on every run, computed by
          # pricing that run's tokens at API list rates. No invoice follows.
          #
          # They are kept — not scrubbed — because they are the ONLY
          # quantitative signal available. Subscription consumption is not
          # exposed as a number anywhere, and this figure is proportional to
          # tokens weighted by model tier, so it is a sound way to compare one
          # run against another and to plan how many rows fit in a usage
          # window. Read them as "notional consumption", never as spend. The
          # real limit that bites is the subscription's usage window, and this
          # project has stalled on it before.
          # ---------------------------------------------------------------
          #
          # `--max-turns` is a flat budget spent by rows of wildly different
          # size, and 80 was set from nothing in particular. GAM-304 is the
          # evidence it was too small: run 31349834462 died at turn 81 with
          # `error_max_turns`, having consumed $9.16 notional over 24.5
          # minutes to produce no branch, no commit, and no PR — and it left
          # the issue claimed in
          # `In Progress`, where the `Backlog -> Todo` webhook can never
          # re-dispatch it. A cap that stops a heavy row mid-change is worse
          # than one that never fires, because the capacity is consumed either
          # way and only this way is the work also lost.
          #
          # That row is the shape this has to fit: a write path behind RLS is
          # item 26's HEAVY trigger, so it carries the full packet -> premise
          # gate -> worker -> checker chain, and item 26 requires the gate to
          # RUN the prescription rather than read it. The same 80 turns also
          # had to cover a one-line fast-tier fix. Only one of those was ever
          # going to fit.
          #
          # 200 is read off that run rather than guessed: 81 turns in
          # 1,473,147 ms is ~18s/turn, so ~200 turns is about what
          # `timeout-minutes: 60` above already buys. The point of matching
          # them is to make the CLOCK the binding backstop and this cap the
          # safety net for a genuinely looping agent — the reverse of what
          # happened here, where a cheap cap fired with 35 minutes unused.
          # Raising this raises worst-case consumption. Measured on GAM-304,
          # all notional and all from the runs' own result objects:
          #
          #   run 31357084288   64 turns / 22 min   $8.52   one gate round
          #   run 31385764526   54 turns / 59 min  $28.58   worker + checker
          #
          # So a full HEAVY row costs roughly $37-45 notional end to end, and
          # ~$85 was consumed on GAM-304 in total — of which ~$36 went to two
          # runs that delivered nothing because of the bugs this file has
          # since fixed.
          #
          # The largest reducible share is NOT the turn cap. Run 31385764526
          # made **238 Bash calls on an opus orchestrator** — `npm ci`, `tsc`,
          # `vitest`, `eslint`, git, mutation replays — mechanical work at the
          # most expensive tier, each result growing an opus context. Two
          # cheaper shapes exist and are not being used: `checker-tests` is
          # pinned **haiku** and its charter is literally "runs lint,
          # typecheck, tests, and build", and item 26 assigns orchestrator
          # mutation-replay to STANDARD while HEAVY gets a separate checker —
          # doing both pays twice. Tracked separately; do not fix it here.
          # ---------------------------------------------------------------
          # THE DELEGATION GRANT — `Task` / `Agent`
          # ---------------------------------------------------------------
          # Without a subagent tool, a dispatched run CANNOT delegate, and
          # every model pin in `.claude/agents/*.md` is dead config: the
          # `opus` premise checker, the `opus` reviewer, the `fable` boss and
          # the `sonnet` worker are all unreachable, and one model plays every
          # role. That is not a cheaper version of the process — it is a
          # different process wearing its name, and it removes the reason to
          # dispatch at all. `AGENTS.md` § "When Codex should delegate" makes
          # STANDARD ("dispatch one worker subagent") and HEAVY ("a
          # premise-checker subagent before dispatch, a separate worker, and a
          # separate checker") unsatisfiable without it.
          #
          # BOTH names are granted deliberately. This repo's agent frontmatter
          # says `Agent` (`.claude/agents/boss-architect.md`), while the CLI
          # has historically called the same tool `Task`. An allowlist entry
          # matching no tool is inert, so granting both costs nothing; getting
          # it wrong costs a run that starts, thinks, delegates nothing, and
          # looks exactly like a working one. That is the same failure shape
          # as note 3 at the top of this file.
          #
          # ---------------------------------------------------------------
          # `--model` — the ORCHESTRATOR only, and it is NEW POLICY
          # ---------------------------------------------------------------
          # Read this before changing it: the constitution does NOT prescribe
          # the mapping below. Item 18 legislates the **worker's** model — a
          # per-dispatch `model: "opus"` override the orchestrator passes when
          # a task hits one of four concrete triggers (migrations, RLS or
          # `security definer`, metric-view SQL, auth/session/role logic), and
          # it says so explicitly: *"The override goes on the dispatch call,
          # not in the agent definition."* That stays exactly where it is. This
          # workflow must not try to encode it — the trigger depends on what
          # the task touches, which is not knowable from a label. Granting
          # `Agent` above is what finally makes item 18 executable at all.
          #
          # What is left unlegislated is the **orchestrator's own** model, and
          # that is what this sets. Authorized by the human owner 2026-08-10,
          # verbatim: *"this whole workflow is designed to be the multiagent
          # setup, with larger decisions and architecture handled by frontier
          # models and workers handled by cheaper models. This is a requirment
          # of the workflow to be high quality while maintaining cost. The
          # dispatch method needs to handle this or there is no real use for
          # the dispatch method."*
          #
          # The orchestrator is the role that judges the tier (item 28d),
          # chooses FAST/STANDARD/HEAVY and must "state and defend" that call
          # (item 26), writes the packet and its item 19d "least confident
          # decisions" list, and integrates verified work. Those are the
          # decisions; the volume underneath them stays on the `sonnet` worker
          # pin. Keyed to the payload tier rather than flat, because the tier
          # is known at dispatch (§7 of the design doc) and paying frontier
          # rates to orchestrate a `tier/fast` one-liner would dilute exactly
          # the saving item 26's fast path exists to create:
          #
          #   heavy       -> opus    orchestrates premise gate + worker + checker
          #   unreviewed  -> opus    judges the tier first, and that judgement
          #                          decides every downstream cost
          #   standard    -> sonnet  dispatches one worker, replays the mutation
          #   fast        -> sonnet  implements directly; item 26 removes the
          #                          ceremony here on purpose
          #
          # This is NOT item 25's retired "bump because it sounds sensitive."
          # Item 25 binds the worker tier to genuine complexity and names the
          # T157 sonnet->opus bump it retires; nothing here touches the worker
          # tier. It is keyed to process depth, not to topic.
          #
          # **Ratification is outstanding.** Authority Boundaries reserve
          # constitution edits to `boss-architect` / `boss-arbiter`, so this
          # comment is not a constitution item and does not become one by
          # being merged. Until an item exists, the constitution is silent
          # here and this file is the only record — which is item 20's failure
          # shape, and the reason it is written out in full rather than left
          # as a flag value.
          claude_args: |
            --model ${{ (github.event.client_payload.tier == 'heavy' || github.event.client_payload.tier == 'unreviewed') && 'opus' || 'sonnet' }}
            --max-turns 300
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Task,Agent"

      # `if: always()` so a failed or timed-out run still yields its transcript —
      # which is exactly the run you want to read. The extra `!= ''` guard is
      # load-bearing: on a run that dies before the action produces a file, the
      # output is an empty string, and `upload-artifact` fails on an empty path
      # rather than skipping. Without it, the step meant to explain a failure
      # would itself fail, in a way that looks like a second unrelated problem.
      # CORRECTED 2026-08-10. The guard used to be
      # `always() && steps.claude.outputs.execution_file != ''`, which was
      # written to stop `upload-artifact` failing on an empty path — a real
      # hazard, described in the note above. But a step that is CANCELLED
      # never sets its outputs, so on the 60-minute timeout the guard read
      # false, this step was skipped, and run 31358757094 produced
      # `total_count: 0` artifacts. The guard protected against a confusing
      # error by guaranteeing no evidence in the one case that most needed it.
      #
      # Fixed by falling back to the path the action actually writes (it logs
      # `Log saved to /home/runner/work/_temp/claude-execution-output.json`)
      # and letting `ignore` handle a genuinely absent file. `always()` still
      # covers failure AND cancellation; only the output-emptiness test is
      # gone, and `if-no-files-found: ignore` now does the job that test was
      # doing.
      #
      # This is best-effort by nature: a hard kill may leave no file at all,
      # since the SDK writes it at the end. That is exactly why the prompt
      # above makes the agent commit a run log to git as it goes — git is the
      # durable record, this artifact is the convenient one.
      - name: Keep the execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-run-${{ github.event.client_payload.identifier }}-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file || '/home/runner/work/_temp/claude-execution-output.json' }}
          if-no-files-found: ignore
          # Long enough to debug something noticed a fortnight later; short
          # enough that transcripts of every dispatch do not accumulate forever.
          retention-days: 30

      # A dispatched run is otherwise a dead end: it leaves a PR and a log, and
      # no way back into the conversation that produced them. The session id
      # makes it resumable with `--resume`, which is the closest thing to the
      # session view a human goes looking for after a run misbehaves.
      - name: Record the session id
        if: always() && steps.claude.outputs.session_id != ''
        run: |
          {
            echo "### Resume this run"
            echo
            echo "\`\`\`"
            echo "claude --resume ${{ steps.claude.outputs.session_id }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # GAM-314. A dispatched run that ends its turn with a subagent still in
  # flight returns normally, so `work` above goes green while the issue it
  # was working sits `In Progress` with the chain unfinished — measured four
  # times (runs 31354278407, 31385764526, 31514339272, 31523233268), none of
  # them anywhere near `--max-turns` or `timeout-minutes`. This job is the
  # only thing in the workflow that reports that condition; without it a
  # green tick is the only signal anyone sees, and it is the wrong one.
  #
  # NOT a turn-budget or clock fix. It changes nothing about when `work`
  # stops; it only checks, after the fact, where the issue was left. Raising
  # either budget above would not have caught any of the four measured runs.
  #
  # NOT "a PR exists". A correct refusal to proceed (the `work` prompt above
  # explicitly invites one, and item 26 rewards a premise check that stops
  # rather than builds on a false premise) leaves no PR at all, and must not
  # fail this job — that is exactly why the check reads the issue's Linear
  # state rather than the run's own artifacts.
  #
  # `In Progress` fails even when `work` stopped deliberately. The prompt
  # above (see "near the wall clock") tells an agent to stop, push what
  # exists, and say so — which ends `work` green with the issue legitimately
  # `In Progress`. That run is still an unfinished chain nobody will
  # re-dispatch, and this job fails it anyway: a green tick on it is exactly
  # the false-success reading GAM-314 is about. Two more shapes end the same
  # way and are not bugs either — an escalation to the human owner under the
  # premise-gate cap or the Loop Limit, or the workspace's own "On open in
  # coding tool -> started" Linear automation moving a row back on its own —
  # and `scripts/linear-assert-released.mjs` names all three so nobody reads
  # a red run here as this check being broken.
  assert-released:
    name: ${{ github.event.client_payload.identifier }} — claim released
    needs: work
    # `always()`, not a plain `needs:`, because the run this exists to catch
    # is a GREEN one — a plain `needs:` already covers that headline case.
    # `always()` additionally runs this job when `work` failed or was
    # cancelled by its `timeout-minutes`. Cite GitHub's documented `always()`
    # semantics for this, not this repository: the one cancelled run measured
    # here (31358757094) shows its post-steps `skipped` under a different,
    # unrelated guard, which proves nothing either way about this job.
    # Note the limit honestly: when `work` is cancelled, the *run's* overall
    # conclusion is `cancelled` regardless of what this job reports, so on
    # that path this buys a red job and a Step Summary line, not a red run.
    if: always() && github.event.client_payload.identifier != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Nothing more than this. This job does not inherit `work`'s
    # `contents/pull-requests/issues: write` — it only ever reads Linear.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      # A separate job with its own checkout, not a step appended to `work`.
      # `work` has held `contents: write` and unrestricted Bash over that
      # workspace for up to 120 minutes; running the evidence-honesty check
      # inside the tree it is judging is the wrong shape — concretely, an
      # agent that left the tree on a ref predating this script would produce
      # `ERR_MODULE_NOT_FOUND` -> exit 1 -> a red job for no reason. On
      # `repository_dispatch`, `actions/checkout` takes the DEFAULT BRANCH, so
      # this job always runs `main`'s copy of the assertion regardless of what
      # `work` did to its own checkout.
      - name: Assert the run released its claim
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_DISPATCH_API_KEY }}
          # The identifier goes through `env:`, never interpolated into
          # `run:`. `client_payload` is attacker-controllable — the `work`
          # job's own `if:` guard above exists because "anyone able to fire a
          # `repository_dispatch` reaches this file directly" — so
          # `run: node … ${{ github.event.client_payload.identifier }}` would
          # be a shell-injection sink. (Contrast "Record the session id"
          # above, which interpolates `steps.claude.outputs.session_id` — a
          # STEP OUTPUT, not attacker-controlled payload data — directly into
          # a `run:` block; that is safe there for a different reason and is
          # not a pattern to copy to `client_payload`.)
          ISSUE_IDENTIFIER: ${{ github.event.client_payload.identifier }}
        # No `npm ci`. `scripts/linear/client.mjs` uses global `fetch` and
        # imports nothing, so this runs on the runner's stock Node — adding an
        # install step would put a minute and a dependency graph between a
        # failure and its report.
        run: node scripts/linear-assert-released.mjs "$ISSUE_IDENTIFIER"

      # The step above goes red for three benign shapes (that script's header
      # lists them). Exactly one — an item-19a escalation — is waiting on the
      # human owner, and nothing else surfaces it: the issue stays `In
      # Progress`, which is indistinguishable from healthy active work, and it
      # lands in no triage queue. Measured on GAM-301: the run escalated, left
      # a detailed comment, and the owner found out by asking.
      #
      # Never a gate. `linear-escalation-notify.mjs` always exits 0, so it
      # cannot add a second, unrelated red cause to an already-failing job, and
      # it stays silent for the other two benign shapes.
      #
      # Same `env:`-not-`run:` rule as above for the identifier —
      # `client_payload` is attacker-controllable and interpolating it into a
      # `run:` block would be a shell-injection sink. Same no-`npm ci` property
      # too: this script uses global `fetch` and imports only
      # `scripts/linear/{client,slack}.mjs`, which do the same.
      - name: Tell the owner if this was an escalation
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_DISPATCH_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ISSUE_IDENTIFIER: ${{ github.event.client_payload.identifier }}
        run: node scripts/linear-escalation-notify.mjs "$ISSUE_IDENTIFIER"
